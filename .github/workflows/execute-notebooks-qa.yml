name: Execute notebooks QA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -q -r requirements.txt
      - name: Ensure price cache
        run: python run_analysis.py
      - name: Execute notebooks 00-09
        working-directory: notebooks
        run: |
          for nb in 00_introduccion.ipynb 01_datos.ipynb 02_crecimiento.ipynb 03_retornos_anuales_mensuales.ipynb 04_metricas.ipynb 05_drawdowns.ipynb 06_activos.ipynb 07_rolling_returns.ipynb 08_correlacion.ipynb 09_frontera_eficiente.ipynb; do
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=300 "$nb"
          done
      - name: Compact SVG outputs
        run: |
          python << 'PY'
          import json, re
          from pathlib import Path
          def shrink(svg: str) -> str:
              svg = re.sub(r"font-family: '[^']+'(, '[^']+')+, sans-serif", "font-family: sans-serif", svg)
              def rn(m):
                  s=m.group(0)
                  if 'e' in s.lower(): return s
                  try: v=float(s)
                  except: return s
                  return f"{v:.3f}".rstrip('0').rstrip('.') if abs(v)<1e6 else s
              svg = re.sub(r"(?<![#\w])-?\d+\.\d{4,}", rn, svg)
              return re.sub(r"<!DOCTYPE[^>]*>\s*", "", svg)
          for p in Path('notebooks').glob('0*.ipynb'):
              nb=json.loads(p.read_text())
              for c in nb['cells']:
                  for o in c.get('outputs',[]):
                      d=o.get('data') or {}
                      if 'image/svg+xml' in d:
                          svg=d['image/svg+xml']
                          if isinstance(svg, list): svg=''.join(svg)
                          d['image/svg+xml']=shrink(svg)
              raw=json.dumps(nb, ensure_ascii=False, separators=(',',':'))
              raw=raw.replace('/home/runner/work/portafolio-backtest-python/portafolio-backtest-python', '..')
              p.write_text(raw, encoding='utf-8')
              print(p.name, p.stat().st_size)
          PY
      - name: Commit executed notebooks + data cache
        run: |
          git config user.name "Andrés Alejandro Rodríguez Lozano"
          git config user.email "124540948+Andalejo1109@users.noreply.github.com"
          git checkout -- figures/ || true
          git add notebooks/*.ipynb data/precios_ajustados_diarios.csv data/precios_mensuales.csv data/retornos_mensuales.csv || true
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "qa(notebooks): executed 00-09 with real matplotlib SVG outputs"
          git push

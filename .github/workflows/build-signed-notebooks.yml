name: Build signed notebooks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Embed real matplotlib SVGs into notebooks
        run: python scripts/build_signed_notebooks.py

      - name: Commit and push
        run: |
          git config user.name "Andrés Alejandro Rodríguez Lozano"
          git config user.email "124540948+Andalejo1109@users.noreply.github.com"
          git add notebooks/*.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes"
            exit 0
          fi
          git commit -m "feat(notebooks): signed 01-03,05-07 with real matplotlib SVG outputs (no PDF/PV)"
          git push
